# Cinematic photoreal style for mystery / creature documentaries.
# Each shot is a photoreal still animated with pans and pushes; hero shots
# get short AI video clips. Faster pacing than the nature styles.
name: Cinematic Real
version: 1

prompt_prefix: >-
  Photorealistic cinematic documentary still, dramatic natural lighting,
  moody teal and amber color grade, atmospheric haze, shot on a full-frame
  cinema camera, shallow depth of field, no text, no letters, no labels,
  no watermark.

prompt_suffix: >-
  Epic, mysterious, high detail, 16:9 composition.

negative_prompt: >-
  text, letters, words, labels, watermark, logo, cartoon, illustration,
  frame, border, blurry, deformed

image:
  width: 1920
  height: 1080

motion:
  clip_seconds: 5
  prompts: {}

timing:
  words_per_minute: 165
  min_shot_sec: 3.0
  pad_sec: 0.5
  fps: 30
overlay: cinematic
